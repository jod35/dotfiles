# Backend (glx is faster on most hardware)
backend = "glx";

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.6;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Fading
fading = true;
fade-delta = 8;
fade-in-step = 0.06;
fade-out-step = 0.06;

# Opacity
inactive-opacity = 0.92;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Blur (very nice effect)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 8;          # higher = more blur

# Rounded corners
corner-radius = 12;

# Animations (if using a version that supports it)
animations = true;
